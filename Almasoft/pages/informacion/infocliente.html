            <!-- Perfil del Cliente -->
      <section class="cliente-perfil">
        <div class="foto-cliente">
          <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto Cliente">
        </div>

        <div class="datos-cliente">
          <h2>Perfil del Cliente</h2>
<p><strong>Nombre:</strong> <span id="nombre">Juan Pérez Rodríguez</span></p>
<p><strong>Documento:</strong> <span id="documento">123456789</span></p>
<p><strong>Teléfono:</strong> <span id="telefono">(601) 456 7890</span></p>
<p><strong>Celular:</strong> <span id="celular">310 456 7890</span></p>
<p><strong>Correo:</strong> <span id="correo">juan.perez@example.com</span></p>
<p><strong>Dirección:</strong> <span id="direccion">Calle 123 #45-67, Bogotá</span></p>
<p><strong>Tipo de Plan:</strong> <span id="plan">Premium</span></p>


      <div class="acciones-cliente">
  <button class="btn-editar" id="btnEditar">Editar información</button>
  <button class="btn-beneficiarios">Ver Beneficiarios</button>
  <button class="btn-cronograma">Ver Cronograma</button>
</div>  
        </div>
      </section>
      

      

    </main>

  <!-- ...contenido anterior... -->

<!-- Modal de edición -->
<div id="modalEditar" class="modal">
  <div class="modal-contenido">
    <span class="cerrar" id="cerrarModal">&times;</span>
    <h2>Editar Información del Cliente</h2>
    <form id="formEditar">
      <label>Nombre: <input type="text" id="input-nombre" required></label>
      <label>Documento: <input type="text" id="input-documento" required></label>
      <label>Teléfono: <input type="text" id="input-telefono"></label>
      <label>Celular: <input type="text" id="input-celular" required></label>
      <label>Correo: <input type="email" id="input-correo" required></label>
      <label>Dirección: <input type="text" id="input-direccion" required></label>
      
      <label>Tipo de Plan:
        <select id="input-plan">
  <option value="Básico">Básico</option>
  <option value="Intermedio">Intermedio</option>
  <option value="Premium">Premium</option>
</select>

      </label>
      <button type="submit">Guardar</button>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="infocliente.js"></script>
