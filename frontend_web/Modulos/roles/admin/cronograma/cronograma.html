<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Interfaz ALMASOFT</title>
  <link rel="stylesheet" href="cronograma.css">
</head>
<body>

  <div class="header">
    <div class="nombre-sistema">ALMASOFT</div>
    <div class="usuario-info">
      <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="usuario">
      <span>DANNY KARINE CAMACHO ROMERO</span>
      <img class="icono-casa" src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="home">
    </div>
  </div>

  <div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="cuadro">CLIENTES <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">USUARIOS <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro1">CATEGORIAS <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">SUB-CATEGORIAS <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">PRODUCTOS <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">COMPRAS <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">TRAMITES <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">CRONOGRAMA <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
      <div class="cuadro">REPORTES <img class="icono" src="https://cdn-icons-png.flaticon.com/512/786/786205.png"></div>
    </div>

    <!-- CONTENIDO CALENDARIO -->
    <div class="contenido">
  <div class="cat" id="titulo-cronograma">MISAS</div>


      <div class="barra-calendario">
        <button onclick="cambiarMes(-1)">⬅</button>
        <div id="mes-actual"></div>
        <button onclick="cambiarMes(1)">➡</button>
      </div>

      <div class="calendario">
        <div class="dias-semana">
          <div>DOM</div><div>LUN</div><div>MAR</div><div>MIE</div><div>JUE</div><div>VIE</div><div>SAB</div>
        </div>
       <div id="dias-mes" class="dias-mes"></div>

      </div>
    </div>

  </div>

  <script src="cronograma.js"></script>
</body>
</html>
